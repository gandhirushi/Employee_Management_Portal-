name: Employee Management Production CD Pipeline

on:
  workflow_run:
    workflows: ["Employee Management CI/CD Build & Publish Pipeline"]
    branches: [main]
    types:
      - completed

jobs:
  deploy-to-ec2:
    name: Deploy to AWS EC2 Instance
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting Continuous Deployment on AWS EC2..."
            
            # 1. Navigate to project directory on EC2
            cd ${{ secrets.PROJECT_PATH }}
            
            # 2. Login to GHCR registry on EC2
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 3. Pull latest pre-built images from GHCR
            echo "📥 Pulling latest Docker images from GHCR..."
            docker compose pull
            
            # 4. Apply database migrations using backend image
            echo "🗄️ Executing Prisma migrations..."
            docker compose run --rm backend npx prisma migrate deploy
            
            # 5. Relaunch containers with zero downtime
            echo "🐳 Restarting production containers..."
            docker compose up -d --remove-orphans
            
            # 6. Clean up dangling/unused images
            echo "🧹 Cleaning unused Docker images..."
            docker image prune -f
            
            echo "🎉 Deployment on AWS EC2 completed successfully!"