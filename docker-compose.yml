version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: meridian-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-york_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-york_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - meridian-network

  # ----------------------------------------------------
  # 2. Express.js Backend Service
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meridian-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-york_db}?schema=public}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - meridian-network

  # ----------------------------------------------------
  # 3. React + Vite Frontend Service (Nginx)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: meridian-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - meridian-network

# ----------------------------------------------------
# Persistent Storage Volumes
# ----------------------------------------------------
volumes:
  postgres_data:
  backend_uploads:

# ----------------------------------------------------
# Isolated Network for Inter-Container Communication
# ----------------------------------------------------
networks:
  meridian-network:
    driver: bridge